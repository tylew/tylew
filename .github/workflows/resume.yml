name: Release Resume

on:
  push:
    branches: [ "main" ]
    paths:
      - "resume/resume.source.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%m)
          DAY=$(date +%d)
          FILENAME="TylerLewis_resume-${YEAR}"
          echo "YEAR=${YEAR}" >> $GITHUB_ENV
          echo "MONTH=${MONTH}" >> $GITHUB_ENV
          echo "DAY=${DAY}" >> $GITHUB_ENV
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV

      - name: Compile resume PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume/resume.source.tex
          args: >
            -interaction=nonstopmode
            -halt-on-error
            -jobname=${{ env.FILENAME }}
            -output-directory=.
          latexmk_use_xelatex: true

      - name: Verify PDF produced
        run: ls -l ${{ env.FILENAME }}.pdf

      - name: Create alias with consistent name
        run: cp ${{ env.FILENAME }}.pdf TylerLewis_resume-latest.pdf

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}.pdf
          path: ${{ env.FILENAME }}.pdf
          if-no-files-found: error

      - name: Set release tag and name
        run: |
          echo "TAG=resume-${{ env.YEAR }}-${{ env.MONTH }}-${{ env.DAY }}" >> $GITHUB_ENV
          echo "NAME=Resume $(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.NAME }}
          body: |
            Automated resume release from main.
          files: |
            ${{ env.FILENAME }}.pdf
            TylerLewis_resume-latest.pdf
          fail_on_unmatched_files: true